name: opengym
services:
  api:
    build:
      context: ./api
      target: default
    restart: always
    env_file: .env
    environment:
      PORT: "3000"
      DATA_DIR: /data
      TRUST_PROXY: "1"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: always
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8084:80"
    environment:
      NGINX_PORT: "80"
      BACKEND: api
      PORT: "3000"
      RESOLVER: 127.0.0.11
      CF_CONNECTING_IP: ""
      BASE_PATH: ""
      MEDIA_UPLOAD_MAX: 48m
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
